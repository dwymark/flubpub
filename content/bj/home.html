<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bijectivity</title>
<style>
  :root{
    --page:#fdfdfb; --ink:#1c1c1c; --soft:#555; --accent:#b3441e; --hair:#c0bdb6;
    --sans:ui-sans-serif,"SF Pro Text",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font:17px/1.55 Georgia,"Iowan Old Style",serif;
  }
  .wrap{max-width:36rem; margin:0 auto; padding:3.6rem 1.1rem 4rem}
  header.masthead{margin:0 0 1.8rem}
  h1{font-size:1.2rem; font-weight:normal; letter-spacing:.01em; margin:0}
  hr.rule{border:0; border-top:1px solid var(--hair); margin:1.3rem 0 0}
  ul.flubpub-pages{list-style:none; margin:0; padding:0}
  ul.flubpub-pages li{margin:0 0 1.15rem; line-height:1.35}
  ul.flubpub-pages a{
    color:var(--ink); text-decoration:none;
    border-bottom:1px solid var(--hair);
  }
  ul.flubpub-pages a:hover{color:var(--accent); border-bottom-color:var(--accent)}
  small.flubpub-date{
    display:block; margin-top:.2rem;
    font-family:var(--sans); font-size:.72rem; letter-spacing:.04em;
    text-transform:uppercase; color:var(--soft);
  }
  .flubpub-description,.flubpub-excerpt{color:var(--soft); font-size:.92rem; margin-top:.15rem}
  .flubpub-empty{color:var(--soft)}
</style>
</head>
<body>
<main class="wrap">
  <header class="masthead">
    <h1>Bijectivity</h1>
    <hr class="rule">
  </header>
  <!--FLUBPUB-LIST-->
</main>
</body>
</html>
