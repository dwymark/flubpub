# flubpub reverse-tunnel support — installed to
# /etc/ssh/sshd_config.d/40-flubpub-tunnel.conf on the VPS by setup-tunnel.sh.
#
# The home machine (WSL) holds an autossh reverse tunnel open to this box with
#   -R 0.0.0.0:<port>:localhost:22
# so that <this-host>:<port> forwards back to the home machine's sshd. Binding
# the forwarded port to 0.0.0.0 (not just loopback) requires the client to be
# allowed to request a wildcard bind. "clientspecified" grants exactly that and
# nothing more: a plain -R with no bind address still binds loopback only, so we
# haven't loosened anything for other forwards.
GatewayPorts clientspecified
