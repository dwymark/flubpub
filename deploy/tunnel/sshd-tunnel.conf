# flubpub reverse-tunnel support — installed to
# /etc/ssh/sshd_config.d/40-flubpub-tunnel.conf on the VPS by setup-tunnel.sh.
#
# The home machine (WSL) holds an autossh reverse tunnel open to this box with
#   -R 0.0.0.0:<port>:localhost:22
# so that <this-host>:<port> forwards back to the home machine's sshd. Binding
# the forwarded port to 0.0.0.0 (not just loopback) requires the client to be
# allowed to request a wildcard bind. "clientspecified" grants exactly that and
# nothing more: a plain -R with no bind address still binds loopback only, so we
# haven't loosened anything for other forwards.
GatewayPorts clientspecified

# Reap dead reverse-tunnel sessions. Without this, a home machine that vanishes
# (WSL sleep, ISP NAT timeout, DNS blip) leaves its ssh session — and the
# 0.0.0.0:<port> listener — held open on this box. Inbound clients then complete
# the TCP handshake against that stale listener and HANG, since the forwarded
# channel leads to a now-dead ssh. Probing every 30s and giving up after 3
# misses drops the corpse in ~90s, so the port frees, clients fail fast instead
# of hanging, and autossh's reconnect can rebind cleanly. Applies to all ssh
# sessions on this box, which is fine: it only closes sessions whose peer has
# actually gone unreachable.
ClientAliveInterval 30
ClientAliveCountMax 3
