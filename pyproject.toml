[project]
name = "flubpub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "click",
    "python-multipart",
    "pyyaml",
    "jinja2",
]

[project.scripts]
flubpub = "flubpub.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flubpub"]
