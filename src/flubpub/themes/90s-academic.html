<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <style>
    /* ------------------------------------------------------------------
       90s-academic — anti-design archetype with modern typography.
       Mobile-first; the centered fixed-width card on a tiled background
       is recovered at >=720px. Pages opt into different mobile-wallpaper
       strategies via inline <style> blocks.
       ------------------------------------------------------------------ */

    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --rule: #c8b89a;
      --card-bg: rgba(255, 253, 246, 0.96);
      --measure: 68ch;
    }

    html { background: var(--bg, #f4ecd8); }

    body {
      margin: 0;
      padding: 0;
      color: var(--fg);
      background-color: var(--bg);
      /* Modern serif stack, falling back through what's actually installed */
      font-family: "Iowan Old Style", "Charter", "Palatino Linotype",
                   Palatino, "Times New Roman", Georgia, serif;
      font-size: clamp(16px, 1rem + 0.25vw, 19px);
      line-height: 1.65;
      min-height: 100vh;
    }

    nav.crumb {
      max-width: var(--measure);
      margin: 0 auto;
      padding: 1rem 1rem 0;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-light, #6a5f4d);
    }
    nav.crumb a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px dotted currentColor;
    }
    nav.crumb a:hover { color: var(--link); }

    main {
      max-width: var(--measure);
      margin: 1.25rem auto 3rem;
      padding: clamp(1rem, 4vw, 2.75rem);
      background: var(--card-bg);
      border: 1px solid var(--rule);
      box-shadow: 0 2px 14px rgba(58, 52, 43, 0.08);
    }

    /* Typography */
    h1, h2, h3, h4 {
      color: var(--heading);
      font-family: inherit;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.005em;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.7rem, 1.4rem + 1.2vw, 2.4rem);
      font-variant: small-caps;
      letter-spacing: 0.02em;
      text-align: center;
    }
    h1 + .lede,
    main > p:first-of-type:not(.lede) { /* play nicely either way */ }
    h2 {
      margin: 2.25rem 0 0.75rem;
      font-size: clamp(1.25rem, 1.1rem + 0.5vw, 1.55rem);
      padding-bottom: 0.2rem;
      border-bottom: 1px solid var(--rule);
    }
    h3 {
      margin: 1.5rem 0 0.5rem;
      font-size: 1.1rem;
      font-style: italic;
      font-weight: 600;
    }

    p { margin: 0 0 1rem; }
    p + p { text-indent: 1.25em; margin-top: -0.25rem; }  /* paragraph runs */

    a { color: var(--link); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
    a:visited { color: var(--link-visited); }
    a:hover { text-decoration-thickness: 2px; }

    hr {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 2rem auto;
      max-width: 60%;
      position: relative;
    }
    hr::after {
      content: "❦";  /* fleuron */
      position: absolute;
      top: -0.7em;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      padding: 0 0.6em;
      color: var(--rule);
      font-size: 1.1rem;
    }

    blockquote {
      margin: 1.25rem 0;
      padding: 0.5rem 1.25rem;
      border-left: 3px solid var(--rule);
      color: var(--ink-light, #6a5f4d);
      font-style: italic;
    }

    code, pre {
      background: var(--code-bg);
      color: var(--code-fg);
      font-family: "JetBrains Mono", "SF Mono", Consolas, "Courier New", monospace;
      font-size: 0.92em;
    }
    code { padding: 1px 5px; border-radius: 3px; }
    pre  { padding: 0.85rem 1rem; overflow-x: auto; border-radius: 4px; border: 1px solid var(--rule); }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
      font-size: 0.95em;
    }
    th, td {
      padding: 0.4rem 0.7rem;
      border-bottom: 1px solid var(--rule);
      text-align: left;
      vertical-align: top;
    }
    th { font-weight: 600; border-bottom: 2px solid var(--ink-light, #6a5f4d); }

    img { max-width: 100%; height: auto; }

    /* The flubpub server-rendered <ul> for markdown indexes lands here */
    ul.flubpub-pages {
      list-style: none;
      padding: 0;
      margin: 1rem 0;
    }
    ul.flubpub-pages li {
      padding: 0.5rem 0;
      border-bottom: 1px dotted var(--rule);
    }
    ul.flubpub-pages li:last-child { border-bottom: none; }
    ul.flubpub-pages a {
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    ul.flubpub-pages a:hover { border-bottom-color: currentColor; }
    ul.flubpub-pages .summary { color: var(--ink-light, #6a5f4d); font-size: 0.92em; }

    /* ---- Default mobile-wallpaper strategy: wp-peek (narrow gutter) ---- */
    @media (max-width: 720px) {
      main {
        margin: 0.5rem 6px;        /* tiny gutter so wallpaper still peeks */
        padding: 1.25rem 1rem;
      }
      h1 { font-size: clamp(1.5rem, 1.3rem + 1.5vw, 2rem); }
      p + p { text-indent: 0; margin-top: 0; }  /* easier to scan on small screens */
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <nav class="crumb"><a href="/">← danielwymark.com</a></nav>
  <main>
    {{ content }}
  </main>
</body>
</html>
