<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <style>
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      line-height: 1.5;
      max-width: 700px;
      margin: 0 auto;
      padding: 1rem;
    }
    h1, h2, h3 { color: var(--heading); font-family: "Times New Roman", Times, serif; }
    h1 { font-size: 1.5em; }
    a { color: var(--link); }
    a:visited { color: var(--link-visited); }
    hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
    code, pre { background: var(--code-bg); color: var(--code-fg); }
    .footer {
      margin-top: 2rem; padding-top: 0.5rem;
      border-top: 1px solid var(--border); font-size: 12px; color: var(--footer-fg, #888);
    }
  </style>
</head>
<body>
  <h1>{{ title }}</h1>
  <hr>
  <div>
    {{ content }}
  </div>
  <div class="footer">
    <hr>
    <p>This page is part of the <a href="/">flubpub</a> archive.</p>
    <p>Last modified: {{ date }}</p>
  </div>
</body>
</html>
