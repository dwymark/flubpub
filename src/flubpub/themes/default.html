<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg);
    }
    nav {
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    nav a {
      font-weight: bold;
      font-size: 1.25rem;
      text-decoration: none;
      color: var(--fg);
    }
    nav a:hover { text-decoration: underline; }
    h1 { margin-top: 0; color: var(--heading); }
    a { color: var(--link); }
    a:visited { color: var(--link-visited); }
    code, pre { background: var(--code-bg); color: var(--code-fg); }
  </style>
</head>
<body>
  <nav><a href="/">flubpub</a></nav>
  <main>
    <h1>{{ title }}</h1>
    {{ content }}
  </main>
</body>
</html>
