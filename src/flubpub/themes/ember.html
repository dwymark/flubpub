{% extends "_papered/_base.html" %}
{# ember - dark mode reading; charcoal + rust accent, truchet curved-arc tile #}
{% block extra_styles %}
:root { --pattern-opacity: 0.22; --pattern-stroke: 1.4; }
{% endblock %}
{% block wallpaper %}
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <pattern id="papered-ember" patternUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <g stroke="var(--pattern-fg)" stroke-width="var(--pattern-stroke)" fill="none">
        <path d="M 0 32 A 32 32 0 0 1 32 0"/>
        <path d="M 32 64 A 32 32 0 0 1 64 32"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#papered-ember)"/>
</svg>
{% endblock %}
