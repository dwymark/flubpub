{% extends "_papered/_base.html" %}
{# folio - quietly bookish; warm parchment + ink, p1-drift wallpaper #}
{% block extra_styles %}
:root { --pattern-opacity: 0.34; }
{% endblock %}
{% block wallpaper %}
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <pattern id="papered-folio" patternUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <path d="M 16 200 Q 64 160 112 200 T 208 200" stroke="var(--pattern-fg)"
            stroke-width="var(--pattern-stroke)" fill="none"/>
      <circle cx="64" cy="80" r="5" fill="var(--pattern-accent)"/>
      <circle cx="160" cy="48" r="2.5" fill="var(--pattern-accent)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#papered-folio)"/>
</svg>
{% endblock %}
