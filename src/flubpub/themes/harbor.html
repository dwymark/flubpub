{% extends "_papered/_base.html" %}
{# harbor - nautical journal; navy + buff card, p1-meander drifting waves #}
{% block extra_styles %}
:root { --pattern-opacity: 0.30; }
{% endblock %}
{% block wallpaper %}
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <pattern id="papered-harbor" patternUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <path d="M 0 96 Q 32 80 64 96 T 128 96 T 192 96 T 256 96"
            stroke="var(--pattern-fg)" stroke-width="var(--pattern-stroke)" fill="none"/>
      <path d="M 0 176 Q 32 160 64 176 T 128 176 T 192 176 T 256 176"
            stroke="var(--pattern-fg)" stroke-width="var(--pattern-stroke)" fill="none"/>
      <circle cx="32" cy="32" r="2.5" fill="var(--pattern-accent)"/>
      <circle cx="200" cy="232" r="2.5" fill="var(--pattern-accent)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#papered-harbor)"/>
</svg>
{% endblock %}
