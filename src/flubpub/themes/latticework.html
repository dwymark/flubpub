{% extends "_papered/_base.html" %}
{# latticework - bauhaus mathematical; ink + teal, p4m-quatrefoil 4-fold #}
{% block extra_styles %}
:root { --pattern-opacity: 0.24; --pattern-stroke: 1.0; }
{% endblock %}
{% block wallpaper %}
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <pattern id="papered-latticework" patternUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <g stroke="var(--pattern-fg)" stroke-width="var(--pattern-stroke)" fill="none">
        <circle cx="64" cy="64" r="28"/>
        <circle cx="192" cy="64" r="28"/>
        <circle cx="64" cy="192" r="28"/>
        <circle cx="192" cy="192" r="28"/>
        <path d="M 0 64 H 36 M 92 64 H 164 M 220 64 H 256"/>
        <path d="M 0 192 H 36 M 92 192 H 164 M 220 192 H 256"/>
        <path d="M 64 0 V 36 M 64 92 V 164 M 64 220 V 256"/>
        <path d="M 192 0 V 36 M 192 92 V 164 M 192 220 V 256"/>
      </g>
      <circle cx="128" cy="128" r="3.5" fill="var(--pattern-accent)"/>
      <circle cx="0" cy="0" r="3.5" fill="var(--pattern-accent)"/>
      <circle cx="256" cy="0" r="3.5" fill="var(--pattern-accent)"/>
      <circle cx="0" cy="256" r="3.5" fill="var(--pattern-accent)"/>
      <circle cx="256" cy="256" r="3.5" fill="var(--pattern-accent)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#papered-latticework)"/>
</svg>
{% endblock %}
