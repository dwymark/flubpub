{% extends "_papered/_base.html" %}
{# meadow - botanical; sage + leaf, cmm-baskets gentle weave #}
{% block extra_styles %}
:root { --pattern-opacity: 0.32; --pattern-stroke: 1.3; }
{% endblock %}
{% block wallpaper %}
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <pattern id="papered-meadow" patternUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <g stroke="var(--pattern-fg)" stroke-width="var(--pattern-stroke)" fill="none">
        <path d="M 64 64 Q 128 32 192 64"/>
        <path d="M 64 192 Q 128 224 192 192"/>
        <path d="M 64 64 Q 32 128 64 192"/>
        <path d="M 192 64 Q 224 128 192 192"/>
      </g>
      <circle cx="128" cy="128" r="3" fill="var(--pattern-accent)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#papered-meadow)"/>
</svg>
{% endblock %}
