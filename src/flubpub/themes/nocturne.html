{% extends "_papered/_base.html" %}
{# nocturne - scholarly dark; deep midnight + silver, penrose rhombi (non-period) #}
{% block extra_styles %}
:root { --pattern-opacity: 0.20; --pattern-stroke: 1.0; }
{% endblock %}
{% block wallpaper %}
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <pattern id="papered-nocturne" patternUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <g stroke="var(--pattern-fg)" stroke-width="var(--pattern-stroke)" fill="none">
        <g transform="translate(64 64) rotate(0)"><polygon points="0,-22 13,0 0,22 -13,0"/></g>
        <g transform="translate(160 64) rotate(36)"><polygon points="0,-22 13,0 0,22 -13,0"/></g>
        <g transform="translate(64 160) rotate(72)"><polygon points="0,-22 13,0 0,22 -13,0"/></g>
        <g transform="translate(160 160) rotate(108)"><polygon points="0,-22 13,0 0,22 -13,0"/></g>
        <g transform="translate(96 96) rotate(144)"><polygon points="0,-22 13,0 0,22 -13,0"/></g>
        <g transform="translate(192 192) rotate(180)"><polygon points="0,-22 13,0 0,22 -13,0"/></g>
        <g transform="translate(32 192) rotate(216)"><polygon points="0,-22 13,0 0,22 -13,0"/></g>
        <g transform="translate(192 32) rotate(252)"><polygon points="0,-22 13,0 0,22 -13,0"/></g>
      </g>
      <circle cx="64" cy="64" r="1.5" fill="var(--pattern-accent)"/>
      <circle cx="160" cy="160" r="1.5" fill="var(--pattern-accent)"/>
      <circle cx="192" cy="32" r="1.5" fill="var(--pattern-accent)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#papered-nocturne)"/>
</svg>
{% endblock %}
