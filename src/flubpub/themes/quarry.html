{% extends "_papered/_base.html" %}
{# quarry - geological dark; basalt + ochre, cmm-diamonds faceted #}
{% block extra_styles %}
:root { --pattern-opacity: 0.18; --pattern-stroke: 1.0; }
{% endblock %}
{% block wallpaper %}
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <pattern id="papered-quarry" patternUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <g stroke="var(--pattern-fg)" stroke-width="var(--pattern-stroke)" fill="none">
        <polygon points="128,32 192,128 128,224 64,128"/>
        <polygon points="0,128 64,32 0,-64"/>
        <polygon points="256,128 192,32 256,-64"/>
        <polygon points="0,128 64,224 0,320"/>
        <polygon points="256,128 192,224 256,320"/>
      </g>
      <circle cx="128" cy="128" r="2.5" fill="var(--pattern-accent)"/>
      <circle cx="0" cy="0" r="2.5" fill="var(--pattern-accent)"/>
      <circle cx="256" cy="256" r="2.5" fill="var(--pattern-accent)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#papered-quarry)"/>
</svg>
{% endblock %}
