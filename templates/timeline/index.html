<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site_title | default("Timeline") }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>

<main class="page">

  <header class="masthead">
    {% if brand or brand is not defined %}<h1 class="brand">{{ brand | default("") }}</h1>{% endif %}
    {% if tagline or tagline is not defined %}<div class="tagline">{{ tagline | default("") }}</div>{% endif %}
  </header>

  <section class="timeline">
    <div class="bands"></div>
    <div class="rail"></div>
    <div class="entries"></div>
    <div class="years"></div>
    <div class="empty">Nothing here yet.</div>
  </section>

  <footer class="page-footer">
    <span>{{ footer_left | default("") }}</span>
    <span>{{ footer_right | default("") }}</span>
  </footer>

</main>

<!-- flubpub fills this tag with the current pages payload at every rebuild.
     Leave id="flubpub-pages" and the type attribute untouched. -->
<script type="application/json" id="flubpub-pages">[]</script>

<script src="script.js"></script>

</body>
</html>
